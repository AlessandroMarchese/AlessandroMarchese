<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="NeurIPS 2025: ClexNet, a causal explanation-guided organ-offer model">
  <defs><clipPath id="k"><rect width="900" height="180" rx="6"/></clipPath></defs>
  <g clip-path="url(#k)">
    <rect width="900" height="180" fill="#ffffff"/>
    <rect width="4" height="180" fill="#6f42c1"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="179" rx="6" fill="none" stroke="#d0d7de"/>
  <rect x="34.5" y="24.5" width="107" height="22" rx="11" fill="none" stroke="#6f42c1"/>
  <text x="88" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6f42c1">NeurIPS 2025</text>
  <text x="34" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2328">ClexNet<tspan font-weight="400" font-size="17" fill="#59636e">  causal, explanation-guided</tspan></text>
  <text x="34" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">Organ-offer acceptance model that learns policy-invariant</text><text x="34" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">representations from refusal-reason signals.</text>
  <line x1="590" x2="590" y1="24" y2="156" stroke="#d0d7de"/>
  <defs><marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#59636e"/></marker></defs>
  <rect x="612" y="64" width="78" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="651.0" y="86.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">offer x</text>
  <rect x="724" y="64" width="62" height="36" rx="6" fill="#f6f8fa" stroke="#6f42c1" stroke-width="1.6"/><text x="755.0" y="86.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#1f2328">φ(x)</text>
  <rect x="820" y="64" width="60" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="850.0" y="86.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">accept?</text>
  <rect x="700" y="128" width="110" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="755.0" y="145.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">refusal reason r</text>
  <line x1="690" y1="82" x2="721" y2="82" stroke="#59636e" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="786" y1="82" x2="817" y2="82" stroke="#59636e" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="755" y1="128" x2="755" y2="103" stroke="#59636e" stroke-width="1.4" marker-end="url(#a2)" stroke-dasharray="3 3"/>
  <text x="755" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#6f42c1">invariant across allocation policies</text>
</svg>
